<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Modula — the Night Dial mark. GENERATED by scripts/make-icon.py; edit that, not this.

    One idea, taken from the kit: the dial is emitting light and everything else is reflecting it.
    The tile is the cabin — a cool near-black, never a warm charcoal, which would put the amber into
    the surface — and the mark is the only lit thing on it.

    Amber is a budget. In the interface it is spent on the frequency; here there is no frequency to
    compete with, so the mark IS the spend: full weight at the centre, weaker at the edge, so the
    signal reads as radiating and falling off rather than as a target. The outer ring is the same
    amber mixed toward the ground, not a second colour.
  -->
  <defs>
    <radialGradient id="cabin" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#14161A"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#cabin)"/>
  <!-- The kit's line token, so the tile keeps an edge on a light desktop. -->
  <rect x="1.25" y="1.25" width="509.5" height="509.5" rx="111" ry="111"
        fill="none" stroke="#23262C" stroke-width="2.5"/>

  <path d="M342.18,172.77 A119.81,119.81 0 0 1 342.18,339.23" fill="none" stroke="#FFB454" stroke-width="28.75" stroke-linecap="round"/>
  <path d="M169.82,339.23 A119.81,119.81 0 0 1 169.82,172.77" fill="none" stroke="#FFB454" stroke-width="28.75" stroke-linecap="round"/>
  <path d="M383.29,133.08 A176.95,176.95 0 0 1 383.29,378.92" fill="none" stroke="#775832" stroke-width="28.75" stroke-linecap="round"/>
  <path d="M128.71,378.92 A176.95,176.95 0 0 1 128.71,133.08" fill="none" stroke="#775832" stroke-width="28.75" stroke-linecap="round"/>

  <circle cx="256" cy="256" r="28.57" fill="#FFB454"/>
</svg>
