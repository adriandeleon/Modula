name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash # ./mvnw is a shell script and windows-latest defaults to PowerShell

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not hide the state of the other two
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The FX tests use JavaFX 26's built-in headless platform, so no Xvfb and no display are
      # needed. The hardware test skips itself via assumeTrue when no dongle is attached, which on a
      # runner is always — that path is exercised on a developer's machine, never here.
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publish test report
        if: always() # a failing build is exactly when the report matters
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 7

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Proves the installer still builds on every platform, which is the half of the build that
      # cannot be checked by running the tests — and the half that only breaks on the two operating
      # systems the author cannot try.
      - name: Build the installer
        run: ./mvnw --batch-mode --no-transfer-progress -Pdist package -DskipTests

      - name: Upload it
        uses: actions/upload-artifact@v4
        with:
          name: modula-${{ matrix.os }}
          path: |
            target/dist/*.deb
            target/dist/*.dmg
            target/dist/*.msi
          if-no-files-found: error # a silently empty artifact is worse than a failure
          retention-days: 14
