name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # a dry run: builds everything, publishes nothing

defaults:
  run:
    shell: bash # ./mvnw is a shell script and windows-latest defaults to PowerShell

# Read-only by default. Only the publish job, which builds nothing, gets the write token it
# needs to create the release.
permissions:
  contents: read

jobs:
  installers:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The tag is the source of the version. The pom is not edited here, because a release built
      # from a tag that disagrees with the pom is a release nobody can reproduce from the repository.
      - name: Check the tag matches the pom
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pom=$(./mvnw --batch-mode -q help:evaluate -Dexpression=project.version -DforceStdout | tail -1)
          echo "tag=$tag pom=$pom"
          if [ "$tag" != "$pom" ]; then
            echo "::error::tag $tag does not match pom version $pom — bump the pom, or retag"
            exit 1
          fi

      # macOS Developer ID signing. The .p12 (certificate + key + Apple's Developer ID G2 intermediate)
      # goes into a throw-away keychain, and jpackage signs the app itself as it builds the dmg: this
      # step writes its signing options (identity, keychain, packaging/mac/Modula.entitlements) to an
      # @file that the build passes as -Djpackage.signArgs. "Notarize the dmg" below signs the dmg,
      # has Apple notarize it and staples the ticket. The secrets: README, "Signing".
      #
      # On a tag, missing secrets fail the leg: an unsigned dmg is what this exists to stop shipping. A
      # manual dry run without them builds ad-hoc signed and says so.
      - name: Import signing certificate (macOS)
        id: macsign
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error title=macOS signing secrets missing::MACOS_CERT_P12 / MACOS_CERT_PASSWORD are not set; refusing to release an unsigned dmg"
              exit 1
            fi
            echo "::warning title=macOS build unsigned::no signing secrets, so this dry run's dmg is ad-hoc signed and not notarized"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/modula-signing.keychain-db"
          kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          # No auto-lock during the build (the default locks after 5 minutes of inactivity).
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          p12="$RUNNER_TEMP/modula-signing.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$p12"
          if ! security import "$p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign; then
            rm -f "$p12"
            echo "::error title=Certificate import failed::macOS could not open MACOS_CERT_P12 with MACOS_CERT_PASSWORD. Usually the password secret does not match the .p12 (re-set it at the gh prompt; a piped echo adds a newline); otherwise the .p12 was exported without openssl's -legacy"
            exit 1
          fi
          rm -f "$p12"
          # Lets codesign use the key without the GUI prompt a runner can never answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          # Add it to the search list next to the login keychain, which codesign needs to build the chain.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "$kc"
            echo "::error title=No Developer ID identity::the imported .p12 holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "Signing as: $identity"
          args="$RUNNER_TEMP/jpackage-mac-sign.args"
          {
            echo "--mac-sign"
            echo "--mac-app-image-sign-identity \"$identity\""
            echo "--mac-signing-keychain \"$kc\""
            echo "--mac-entitlements \"$GITHUB_WORKSPACE/packaging/mac/Modula.entitlements\""
          } > "$args"
          cat "$args"
          {
            echo "MODULA_JPACKAGE_SIGN_ARGS=$args"
            echo "MODULA_MAC_SIGN_IDENTITY=$identity"
            echo "MODULA_MAC_KEYCHAIN=$kc"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # With the tests: a tag can point at a commit whose CI failed, and a release is the last place
      # to find that out. On a signing macOS leg jpackage also signs the app (see the step above).
      - name: Build the installer
        run: |
          ./mvnw --batch-mode --no-transfer-progress -Pdist clean package \
            ${MODULA_JPACKAGE_SIGN_ARGS:+"-Djpackage.signArgs=@$MODULA_JPACKAGE_SIGN_ARGS"}

      # The dmg gets its own signature (jpackage signs only the app inside it), then Apple scans it and,
      # if it passes, issues a ticket; stapling attaches it so Gatekeeper accepts the dmg offline too. A
      # rejection prints Apple's log, which names each offending file. The checks at the end are what
      # Gatekeeper does on a user's Mac, and then the notarized app is started under the hardened runtime
      # and must still be running 20 seconds later (no dongle on a runner, so it just shows its window).
      - name: Notarize the dmg (macOS)
        if: steps.macsign.outputs.enabled == 'true'
        timeout-minutes: 35
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "::error title=Notarization secrets missing::APPLE_API_KEY_P8 / APPLE_API_KEY_ID are not set"
            exit 1
          fi
          # Easy to mix up when copying them off the Integrations page: the issuer is a UUID shown above the
          # key list, the key ID is 10 characters in the key's row. Say which one is wrong before Apple does.
          uuid='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          if [ -n "$APPLE_API_ISSUER" ] && ! [[ "$APPLE_API_ISSUER" =~ $uuid ]]; then
            echo "::error title=APPLE_API_ISSUER is not an issuer ID::it must be the UUID shown as Issuer ID above the team key list (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)"
            exit 1
          fi
          if ! [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=APPLE_API_KEY_ID is not a key ID::it must be the 10-character Key ID from the key's row"
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          # A team key needs the issuer; an individual key has none.
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID")
          [ -n "$APPLE_API_ISSUER" ] && auth+=(--issuer "$APPLE_API_ISSUER")

          dmg="$(ls target/dist/*.dmg | head -1)"
          codesign --force --timestamp --keychain "$MODULA_MAC_KEYCHAIN" --sign "$MODULA_MAC_SIGN_IDENTITY" "$dmg"
          codesign --verify --verbose=2 "$dmg"
          # The app INSIDE the dmg must carry our signature, intact, with the hardened runtime. Checking
          # here takes seconds and names what is wrong; Apple takes minutes to say only "invalid".
          pre="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$pre" "$dmg" > /dev/null
          details="$(codesign -dv --verbose=2 "$pre"/*.app 2>&1 || true)"
          echo "$details"
          if ! grep -q '^Authority=Developer ID Application' <<< "$details" || ! grep -q 'flags=.*runtime' <<< "$details"; then
            hdiutil detach "$pre" > /dev/null || true
            echo "::error title=dmg app not Developer ID signed::the app inside $(basename "$dmg") is not Developer ID signed with the hardened runtime"
            exit 1
          fi
          if ! codesign --verify --deep --strict --verbose=4 "$pre"/*.app; then
            hdiutil detach "$pre" > /dev/null || true
            echo "::error title=dmg app signature broken::the app inside $(basename "$dmg") does not verify; the codesign output above names what is wrong"
            exit 1
          fi
          hdiutil detach "$pre" > /dev/null

          echo "Notarizing $dmg"
          out="$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 30m --output-format json)" || true
          echo "$out"
          id="$(printf '%s' "$out" | jq -r '.id // empty')"
          status="$(printf '%s' "$out" | jq -r '.status // empty')"
          if [ -n "$id" ]; then
            xcrun notarytool log "$id" "${auth[@]}" || true
          fi
          rm -f "$key"
          if [ "$status" != "Accepted" ]; then
            echo "::error title=Notarization failed::Apple returned '${status:-no result}' for $(basename "$dmg"); the log above lists the problems"
            exit 1
          fi

          # Stapling fetches the ticket from Apple's CDN and validates it in the same call. That fetch
          # can drop, and the ticket sometimes takes a moment to publish, so retry it.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple "$dmg" && break
            [ "$attempt" = 5 ] && { echo "::error title=Stapling failed::notarized, but the ticket could not be stapled"; exit 1; }
            sleep 20
          done
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          trap 'hdiutil detach -force "$mnt" > /dev/null 2>&1 || true' EXIT
          app="$(ls -d "$mnt"/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"

          log="$RUNNER_TEMP/modula-launch.log"
          "$app/Contents/MacOS/Modula" > "$log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2> /dev/null; then
            cat "$log"
            echo "::error title=Notarized app did not stay up::Modula exited within 20 s of starting under the hardened runtime; its output is above"
            exit 1
          fi
          kill "$pid" || true
          wait "$pid" 2> /dev/null || true
          echo "notarized app ran for 20 s under the hardened runtime"
          echo "- ✅ ${{ matrix.target }}: signed, notarized and stapled" >> "$GITHUB_STEP_SUMMARY"

      # What the deb must contain to list properly in GNOME Software and install on older releases
      # (scripts/check-linux-package.sh). Each of these once shipped wrong and looked fine.
      - name: Check the Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils appstream
          bash scripts/check-linux-package.sh target/dist

      # One consistent name per target, since jpackage names its output per-platform and without
      # the architecture.
      - name: Stage
        run: |
          mkdir -p staged
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version=$(./mvnw --batch-mode -q help:evaluate \
            -Dexpression=project.version -DforceStdout | tail -1)
          found=0
          for f in target/dist/*.deb target/dist/*.dmg target/dist/*.msi; do
            [ -e "$f" ] || continue
            cp "$f" "staged/Modula-$version-${{ matrix.target }}.${f##*.}"
            found=1
          done
          [ "$found" = 1 ] || { echo "::error::no installer was produced"; exit 1; }
          ls -la staged

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}
          path: staged/*
          if-no-files-found: error

      # The runner is ephemeral, but the keychain holds the private key, so remove it as soon as we're done.
      - name: Remove signing keychain (macOS)
        if: always() && steps.macsign.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/modula-signing.keychain-db" || true

  # Signs the deb (scripts/sign-linux-packages.sh): an embedded origin signature, and a detached .asc
  # beside it. In a job of its own so the key is never on a runner that builds, since those execute
  # whatever Maven resolves. It replaces the build's artifact with the signed files, so the publish job
  # sees only those. The secrets: README, "Signing".
  #
  # On a tag the key is required, and must be the committed packaging/linux/signing-key.asc. A manual
  # dry run without it signs with a key made for the run, so the step is still exercised, and says so.
  sign-linux:
    name: sign Linux package
    runs-on: ubuntu-latest
    needs: installers
    steps:
      - uses: actions/checkout@v7

      - name: Signing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debsig-verify

      # One directory per artifact: linux/installer-linux-x64.
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-linux-*
          path: linux

      - name: Sign
        env:
          LINUX_GPG_KEY: ${{ secrets.LINUX_GPG_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -n "$LINUX_GPG_KEY" ]; then
            export MODULA_GPG_KEY="$LINUX_GPG_KEY" MODULA_GPG_PASSPHRASE="$LINUX_GPG_PASSPHRASE"
            export MODULA_GPG_EXPECTED_KEY=packaging/linux/signing-key.asc
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error title=Linux signing key missing::LINUX_GPG_KEY is not set; refusing to release an unsigned Linux package"
            exit 1
          else
            echo "::warning title=Linux package signed with a throw-away key::no LINUX_GPG_KEY, so this dry run signs with a key made for it"
            export GNUPGHOME="$RUNNER_TEMP/throwaway-gnupg"
            mkdir -m 700 "$GNUPGHOME"
            gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key 'Modula dry run <dry-run@modula.invalid>' rsa4096 sign 1d
            MODULA_GPG_KEY="$(gpg --batch --armor --export-secret-keys)"
            export MODULA_GPG_KEY
            unset GNUPGHOME
          fi
          mkdir -p key
          bash scripts/sign-linux-packages.sh key/modula-signing-key.asc linux/*/
          bash scripts/check-linux-signatures.sh key/modula-signing-key.asc linux/*/
          ls -la linux/*/
          fpr=$(gpg --with-colons --import-options show-only --import key/modula-signing-key.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "- ✅ Linux: signed with \`$fpr\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed (linux-x64)
        uses: actions/upload-artifact@v7
        with:
          name: installer-linux-x64
          path: linux/installer-linux-x64/*
          overwrite: true
          if-no-files-found: error

      - name: Upload the public key
        uses: actions/upload-artifact@v7
        with:
          name: signing-key
          path: key/modula-signing-key.asc
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [installers, sign-linux]
    if: startsWith(github.ref, 'refs/tags/v') # a manual run is a dry run and publishes nothing
    permissions:
      contents: write # to create the release and attach the installers
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          draft: true # a human decides when it goes live, and can read the notes first
          generate_release_notes: true
          fail_on_unmatched_files: true
