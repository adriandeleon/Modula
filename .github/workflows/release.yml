name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # a dry run: builds everything, publishes nothing

defaults:
  run:
    shell: bash # ./mvnw is a shell script and windows-latest defaults to PowerShell

permissions:
  contents: write # needed to create the release and attach the installers

jobs:
  installers:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The tag is the source of the version. The pom is not edited here, because a release built
      # from a tag that disagrees with the pom is a release nobody can reproduce from the repository.
      - name: Check the tag matches the pom
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pom=$(./mvnw --batch-mode -q help:evaluate -Dexpression=project.version -DforceStdout | tail -1)
          echo "tag=$tag pom=$pom"
          if [ "$tag" != "$pom" ]; then
            echo "::error::tag $tag does not match pom version $pom — bump the pom, or retag"
            exit 1
          fi

      - name: Build the installer
        run: ./mvnw --batch-mode --no-transfer-progress -Pdist clean package -DskipTests

      # One consistent name per target, since jpackage names its output per-platform and without
      # the architecture.
      - name: Stage
        run: |
          mkdir -p staged
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version=$(./mvnw --batch-mode -q help:evaluate \
            -Dexpression=project.version -DforceStdout | tail -1)
          found=0
          for f in target/dist/*.deb target/dist/*.dmg target/dist/*.msi; do
            [ -e "$f" ] || continue
            cp "$f" "staged/Modula-$version-${{ matrix.target }}.${f##*.}"
            found=1
          done
          [ "$found" = 1 ] || { echo "::error::no installer was produced"; exit 1; }
          ls -la staged

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: staged/*
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v') # a manual run is a dry run and publishes nothing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true # a human decides when it goes live, and can read the notes first
          generate_release_notes: true
          fail_on_unmatched_files: true
